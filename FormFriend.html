<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FormFriend - Ihr Helfer für deutsche Formulare</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f7fa;color:#333;line-height:1.6}
.app{min-height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header h1{font-size:1.5rem;cursor:pointer}
main{flex:1;max-width:800px;width:100%;margin:0 auto;padding:2rem 1rem}
footer{background:#1e293b;color:#94a3b8;text-align:center;padding:1rem;font-size:.85rem}
.lang-bar{display:flex;gap:.4rem;flex-wrap:wrap}
.lang-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:.3rem .6rem;border-radius:6px;cursor:pointer;font-size:.85rem}
.lang-btn:hover,.lang-btn.active{background:rgba(255,255,255,.35);border-color:#fff}
.hero{text-align:center;margin-bottom:2rem}
.hero h2{font-size:1.8rem;color:#1e293b;margin-bottom:.75rem}
.hero p{color:#64748b;font-size:1.05rem;max-width:600px;margin:0 auto}
.actions{display:flex;gap:1rem;justify-content:center;margin-bottom:2.5rem;flex-wrap:wrap}
.btn{border:none;border-radius:8px;padding:.75rem 1.5rem;font-size:1rem;cursor:pointer;font-weight:600;transition:all .2s}
.btn-big{padding:1rem 2rem;font-size:1.1rem}
.btn-blue{background:#2563eb;color:#fff}.btn-blue:hover{background:#1d4ed8}
.btn-gray{background:#e2e8f0;color:#475569}.btn-gray:hover{background:#cbd5e1}
.btn-green{background:#16a34a;color:#fff}.btn-green:hover{background:#15803d}
.steps{display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap}
.step-card{background:#fff;border-radius:12px;padding:1.5rem;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08);flex:1;min-width:150px;max-width:200px}
.step-num{width:48px;height:48px;border-radius:50%;background:#dbeafe;color:#2563eb;display:flex;align-items:center;justify-content:center;margin:0 auto .75rem;font-size:1.25rem;font-weight:700}
.step-card h3{font-size:.95rem;color:#475569}
.back-btn{display:inline-flex;align-items:center;gap:.5rem;color:#2563eb;cursor:pointer;font-size:.95rem;margin-bottom:1.5rem;background:none;border:none;font-weight:600}
.back-btn:hover{color:#1d4ed8}
.card{background:#fff;border-radius:12px;padding:1.25rem;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:1rem;cursor:pointer;border-left:4px solid #2563eb;transition:all .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.12)}
.card h3{color:#1e293b;margin-bottom:.5rem}
.card p{color:#64748b;font-size:.9rem}
.tag{display:inline-block;background:#dbeafe;color:#2563eb;padding:.2rem .6rem;border-radius:4px;font-size:.8rem;font-weight:600;margin-bottom:.5rem}
.wizard{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow:hidden}
.wiz-head{background:#f8fafc;padding:1.25rem;border-bottom:1px solid #e2e8f0}
.wiz-head h2{font-size:1.25rem;color:#1e293b}
.progress-row{display:flex;align-items:center;gap:.5rem;margin-top:.75rem;font-size:.9rem;color:#64748b}
.progress-bar{flex:1;height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:#2563eb;border-radius:3px;transition:width .3s}
.wiz-body{padding:2rem 1.5rem}
.field-label{display:block;font-weight:600;color:#1e293b;margin-bottom:.5rem;font-size:1.05rem}
.field-explain{background:#eff6ff;border-left:3px solid #2563eb;padding:.75rem 1rem;margin-bottom:.75rem;border-radius:0 6px 6px 0;color:#475569;font-size:.9rem}
[dir=rtl] .field-explain{border-left:none;border-right:3px solid #2563eb;border-radius:6px 0 0 6px}
[dir=rtl] .card{border-left:none;border-right:4px solid #2563eb}
.field-input,.field-select{width:100%;padding:.75rem;border:2px solid #e2e8f0;border-radius:8px;font-size:1rem}
.field-input:focus,.field-select:focus{outline:none;border-color:#2563eb}
.field-err{color:#dc2626;font-size:.85rem;margin-top:.25rem}
.wiz-foot{display:flex;justify-content:space-between;padding:1.25rem;border-top:1px solid #e2e8f0;background:#f8fafc}
.doc-item{display:flex;align-items:center;gap:.75rem;padding:.5rem 0;color:#475569}
.doc-item input{width:20px;height:20px;cursor:pointer}
.sub-info{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:1rem;margin-top:1rem}
.sub-info h3{color:#166534;margin-bottom:.5rem}
.sub-info p{color:#15803d}
.completion{text-align:center;padding:2rem}
.completion h2{color:#16a34a;font-size:1.5rem;margin-bottom:1rem}
.completion p{color:#64748b;margin-bottom:1.5rem}
.summary-row{padding:.4rem 0;border-bottom:1px solid #e2e8f0;text-align:left}
.gloss-card{background:#fff;border-radius:12px;padding:1.25rem;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:1rem}
.gloss-card h3{color:#1e293b;margin-bottom:.5rem;font-size:1.05rem}
.gloss-card p{color:#64748b;font-size:.95rem}
.hidden{display:none}
.btn-orange{background:#ea580c;color:#fff}.btn-orange:hover{background:#c2410c}
.scan-area{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:1.5rem;margin-bottom:1rem}
.scan-area h2{color:#1e293b;margin-bottom:1rem}
.camera-box{position:relative;width:100%;max-width:500px;margin:0 auto;border-radius:12px;overflow:hidden;background:#000}
.camera-box video,.camera-box canvas,.camera-box img{width:100%;display:block;border-radius:12px}
.camera-box canvas{display:none}
.snap-btn{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;background:#fff;border:4px solid #2563eb;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.snap-btn:hover{background:#dbeafe}
.scan-result{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:1.5rem;margin-top:1rem}
.scan-result h2{color:#16a34a;margin-bottom:.5rem}
.scan-result h3{color:#1e293b;margin:.75rem 0 .5rem}
.scan-result p{color:#475569;margin-bottom:.5rem}
.scan-result ul{list-style:none;padding:0}
.scan-result li{padding:.4rem 0;color:#475569;display:flex;align-items:center;gap:.5rem}
.scan-result li::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#2563eb;flex-shrink:0}
.scan-or{text-align:center;color:#94a3b8;margin:1rem 0;font-size:.9rem}
.scan-upload{display:block;width:100%;padding:1rem;border:2px dashed #cbd5e1;border-radius:8px;text-align:center;cursor:pointer;color:#64748b;background:#f8fafc;font-size:1rem}
.scan-upload:hover{border-color:#2563eb;color:#2563eb}
.scan-preview{width:100%;max-width:500px;margin:1rem auto;border-radius:12px;display:block}
@media(max-width:640px){header{flex-direction:column;gap:.75rem}.hero h2{font-size:1.4rem}.actions{flex-direction:column;align-items:center}.steps{flex-direction:column;align-items:center}.step-card{max-width:100%}.lang-bar{justify-content:center}.wiz-body{padding:1.25rem 1rem}}
</style>

function t(key){ return (ui[lang]||ui.de)[key]||(ui.de)[key]||key; }
function tObj(obj){ return obj[lang]||obj.de||''; }
function catName(c){ return t('cat_'+c); }

function renderLangBar(){
  var h='';
  langs.forEach(function(l){
    h+='<button class="lang-btn'+(l.code===lang?' active':'')+'" onclick="setLang(\''+l.code+'\')">'+l.name+'</button>';
  });
  document.getElementById('langBar').innerHTML=h;
}

function setLang(code){
  lang=code;
  var l=langs.find(function(x){return x.code===code});
  dir=l?l.dir:'ltr';
  document.getElementById('app').setAttribute('dir',dir);
  renderLangBar();
  if(currentView==='home') showHome();
  else if(currentView==='forms') showForms();
  else if(currentView==='glossary') showGlossary();
  else if(currentView==='wizard') showWizard();
  else if(currentView==='scan') showScan();
}

  h+='<div class="step-card"><div class="step-num">2</div><h3>'+t('step2')+'</h3></div>';
  h+='<div class="step-card"><div class="step-num">3</div><h3>'+t('step3')+'</h3></div>';
  h+='</div>';

  document.getElementById('footer').innerHTML='<p>FormFriend &copy; 2026 - '+t('privacy')+'</p>';
}

function showForms(){
  currentView='forms';
  var h='<button class="back-btn" onclick="showHome()">&larr; '+t('home')+'</button>';
  h+='<h2 style="margin-bottom:1.5rem;color:#1e293b">'+t('selectForm')+'</h2>';
  forms.forEach(function(f,i){
    h+='<div class="card" onclick="startForm('+i+')">';
    h+='<span class="tag">'+catName(f.cat)+'</span>';
    h+='<h3>'+tObj(f.name)+'</h3>';
    h+='<p>'+tObj(f.desc)+'</p></div>';
  });
  document.getElementById('main').innerHTML=h;
}

function startForm(idx){
  currentForm=forms[idx];
  currentStep=0;
  answers={};
  docChecks={};
  showWizard();
}

function showWizard(){
  currentView='wizard';
  var f=currentForm;
  var total=f.fields.length+2;
  var isDoc=currentStep===f.fields.length;
  var isSub=currentStep===f.fields.length+1;
  var prog=((currentStep+1)/total)*100;
  var h='<button class="back-btn" onclick="showForms()">&larr; '+t('forms')+'</button>';
  h+='<div class="wizard"><div class="wiz-head"><h2>'+tObj(f.name)+'</h2>';
  h+='<div class="progress-row"><span>'+t('step')+' '+(currentStep+1)+' '+t('of')+' '+total+'</span>';
  h+='<div class="progress-bar"><div class="progress-fill" style="width:'+prog+'%"></div></div></div></div>';
  h+='<div class="wiz-body">';

  if(!isDoc && !isSub){
    var fd=f.fields[currentStep];
    h+='<label class="field-label">'+tObj(fd.label)+'</label>';
    h+='<div class="field-explain">'+tObj(fd.explain)+'</div>';
    if(fd.type==='select'){
      h+='<select class="field-select" id="fieldInput" onchange="answers[\''+fd.id+'\']=this.value">';
      h+='<option value="">--</option>';
      fd.opts.forEach(function(o){
        h+='<option value="'+o.v+'"'+(answers[fd.id]===o.v?' selected':'')+'>'+tObj(o.l)+'</option>';
      });
      h+='</select>';
    } else {
      h+='<input class="field-input" id="fieldInput" type="'+(fd.type==='date'?'date':'text')+'" value="'+(answers[fd.id]||'')+'" oninput="answers[\''+fd.id+'\']=this.value">';
    }
    h+='<div class="field-err" id="fieldErr"></div>';
  }

  if(isDoc){
    h+='<h3 style="margin-bottom:.5rem">'+t('docs')+'</h3>';
    h+='<p style="color:#64748b;margin-bottom:1rem">'+t('docsQ')+'</p>';
    var docs=f.docs[lang]||f.docs.de;
    docs.forEach(function(d,i){
      h+='<div class="doc-item"><input type="checkbox" '+(docChecks[i]?'checked':'')+' onchange="docChecks['+i+']=this.checked"><span>'+d+'</span></div>';
    });
  }

  if(isSub){
    h+='<div class="sub-info"><h3>'+t('where')+'</h3><p>'+tObj(f.submit)+'</p></div>';
    h+='<div style="margin-top:1.5rem"><h3 style="margin-bottom:.75rem">'+t('summary')+'</h3>';
    f.fields.forEach(function(fd){
      h+='<div class="summary-row"><strong>'+tObj(fd.label)+':</strong> '+(answers[fd.id]||'-')+'</div>';
    });
    h+='</div>';
  }

  h+='</div><div class="wiz-foot">';
  h+='<button class="btn btn-gray" onclick="wizPrev()"'+(currentStep===0?' disabled':'')+'>'+t('back')+'</button>';
  h+='<button class="btn btn-blue" onclick="wizNext()">'+(isSub?t('submit'):t('next'))+'</button>';
  h+='</div></div>';
  document.getElementById('main').innerHTML=h;
  var inp=document.getElementById('fieldInput');
  if(inp&&inp.type!=='date') inp.focus();
}

function wizNext(){
  var f=currentForm;
  var total=f.fields.length+2;
  var isDoc=currentStep===f.fields.length;
  var isSub=currentStep===f.fields.length+1;

  if(!isDoc&&!isSub){
    var fd=f.fields[currentStep];
    if(fd.req&&(!answers[fd.id]||answers[fd.id].trim()==='')){
      document.getElementById('fieldErr').textContent=t('required');
      return;
    }
  }
  if(isSub){showComplete();return;}
  currentStep++;
  showWizard();
}

function wizPrev(){
  if(currentStep>0){currentStep--;showWizard();}
}

function showComplete(){
  currentView='complete';
  var f=currentForm;
  var h='<button class="back-btn" onclick="showForms()">&larr; '+t('forms')+'</button>';
  h+='<div class="wizard"><div class="completion">';
  h+='<h2>'+t('done')+'</h2><p>'+t('ready')+'</p>';
  h+='<div style="margin-bottom:1.5rem;text-align:left">';
  h+='<h3 style="margin-bottom:.75rem">'+t('summary')+'</h3>';
  f.fields.forEach(function(fd){
    h+='<div class="summary-row"><strong>'+tObj(fd.label)+':</strong> '+(answers[fd.id]||'-')+'</div>';
  });
  h+='</div>';
  h+='<button class="btn btn-green btn-big" onclick="downloadForm()">'+t('download')+'</button>';
  h+='</div></div>';
  document.getElementById('main').innerHTML=h;
}

function downloadForm(){
  var f=currentForm;
  var lines=[tObj(f.name),'========================================',''];
  f.fields.forEach(function(fd){
    lines.push(tObj(fd.label)+': '+(answers[fd.id]||'-'));
  });
  lines.push('','========================================');
  lines.push('FormFriend - '+new Date().toLocaleDateString());
  var blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download=f.id+'_ausgefuellt.txt';a.click();
  URL.revokeObjectURL(url);
}

function showGlossary(){
  currentView='glossary';
  var h='<button class="back-btn" onclick="showHome()">&larr; '+t('home')+'</button>';
  h+='<h2 style="margin-bottom:1.5rem;color:#1e293b">'+t('glossary')+'</h2>';
  glossary.forEach(function(g){
    h+='<div class="gloss-card"><h3>'+g.term+'</h3><p>'+tObj(g.ex)+'</p></div>';
  });
  document.getElementById('main').innerHTML=h;
}

// ========== SCAN FUNCTIONS ==========
var scanStream = null;

function showScan(){
  currentView='scan';
  var h='<button class="back-btn" onclick="stopCamera();showHome()">&larr; '+t('home')+'</button>';
  h+='<div class="scan-area">';
  h+='<h2>'+t('scanTitle')+'</h2>';
  h+='<p style="color:#64748b;margin-bottom:1.5rem">'+t('scanDesc')+'</p>';
  h+='<div class="camera-box" id="cameraBox">';
  h+='<video id="camVideo" autoplay playsinline></video>';
  h+='<canvas id="camCanvas"></canvas>';
  h+='<button class="snap-btn" id="snapBtn" onclick="takePhoto()" title="'+t('scanPhoto')+'"></button>';
  h+='</div>';
  h+='<p class="scan-or">'+t('scanOr')+'</p>';
  h+='<label class="scan-upload">';
  h+=t('scanUpload');
  h+='<input type="file" accept="image/*" capture="environment" style="display:none" onchange="uploadPhoto(event)">';
  h+='</label>';
  h+='</div>';
  h+='<div id="scanResult"></div>';
  document.getElementById('main').innerHTML=h;
  startCamera();
}

function startCamera(){
  var video=document.getElementById('camVideo');
  if(!video) return;
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})
    .then(function(stream){
      scanStream=stream;
      video.srcObject=stream;
    })
    .catch(function(){
      // Camera not available - hide camera, show upload only
      var box=document.getElementById('cameraBox');
      if(box) box.style.display='none';
    });
  } else {
    var box=document.getElementById('cameraBox');
    if(box) box.style.display='none';
  }
}

function stopCamera(){
  if(scanStream){
    scanStream.getTracks().forEach(function(track){track.stop();});
    scanStream=null;
  }
}

function takePhoto(){
  var video=document.getElementById('camVideo');
  var canvas=document.getElementById('camCanvas');
  if(!video||!canvas) return;
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  stopCamera();
  // Show captured image
  var img=canvas.toDataURL('image/jpeg');
  var box=document.getElementById('cameraBox');
  box.innerHTML='<img src="'+img+'" class="scan-preview">';
  // Simulate OCR analysis
  simulateAnalysis(img);
}

function uploadPhoto(event){
  var file=event.target.files[0];
  if(!file) return;
  stopCamera();
  var reader=new FileReader();
  reader.onload=function(e){
    var img=e.target.result;
    var box=document.getElementById('cameraBox');
    if(box){
      box.innerHTML='<img src="'+img+'" class="scan-preview">';
      box.style.display='block';
    }
    simulateAnalysis(img);
  };
  reader.readAsDataURL(file);
}

function simulateAnalysis(imgData){
  var resultDiv=document.getElementById('scanResult');
  resultDiv.innerHTML='<div class="scan-area" style="text-align:center"><p>'+t('scanAnalyzing')+'</p></div>';

  // Simulate OCR delay, then show manual selection since we can't do real OCR in a standalone HTML
  setTimeout(function(){
    showLetterSelection();
  }, 1500);
}
